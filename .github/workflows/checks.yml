name: Student Task Manager CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          pwd
          ls -la
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required project files exist!"
